name: global-dramas-admin
services:
  postgres:
    image: postgres:17-bookworm
    env_file:
      - .env.local
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  server:
    image: golang:1.26-bookworm
    working_dir: /workspace/server
    environment:
      GOPROXY: https://goproxy.cn,direct
      GVA_CONFIG: config.local.yaml
      TZ: Asia/Shanghai
    command: ["sh", "-c", "go build -o /tmp/global-dramas-admin . && exec /tmp/global-dramas-admin -c config.local.yaml"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/web
    environment:
      VITE_BASE_PATH: http://server
      VITE_DOCKER: "true"
      TZ: Asia/Shanghai
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 8080 --strictPort --mode development"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/workspace
      - web-modules:/workspace/web/node_modules
      - npm-cache:/root/.npm
    depends_on:
      - server
    restart: unless-stopped
volumes:
  go-mod:
  go-build:
  web-modules:
  npm-cache:
  pg-data:
