name: gload-dramas
services:
  postgres:
    image: postgres:17-bookworm
    env_file:
      - .env.local
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  server:
    image: golang:1.26-bookworm
    working_dir: /workspace/server
    environment:
      GOPROXY: https://goproxy.cn,direct
      GVA_CONFIG: config.local.yaml
      TZ: Asia/Shanghai
    command: ["sh", "-c", "go build -o /tmp/gload-dramas . && exec /tmp/gload-dramas -c config.local.yaml"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  webAdmin:
    image: node:22-bookworm-slim
    working_dir: /workspace/webAdmin
    environment:
      API_TARGET: http://server:8888
      HOST: 0.0.0.0
      PORT: "8080"
      TZ: Asia/Shanghai
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/workspace
      - backoffice-pro-modules:/workspace/webAdmin/node_modules
      - npm-cache:/root/.npm
    depends_on:
      - server
    restart: unless-stopped
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/web
    environment:
      VITE_API_TARGET: http://server:8888
      TZ: Asia/Shanghai
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 8081 --strictPort"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/workspace
      - frontend-modules:/workspace/web/node_modules
      - npm-cache:/root/.npm
    depends_on:
      - server
    restart: unless-stopped

volumes:
  go-mod:
  go-build:
  backoffice-pro-modules:
  frontend-modules:
  npm-cache:
  pg-data:
