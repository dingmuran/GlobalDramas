server {
    listen 80;
    listen [::]:80;
    server_name huanqiucs.com www.huanqiucs.com 64.83.14.222;
    root /var/www/huanqiucs/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/huanqiucs.access.log;
    error_log /var/log/nginx/huanqiucs.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location ^~ /api/ { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
