server {
    listen 80;
    listen [::]:80;
    server_name huanqiucs.com www.huanqiucs.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://huanqiucs.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huanqiucs.com www.huanqiucs.com;
    ssl_certificate /etc/letsencrypt/live/huanqiucs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huanqiucs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /var/www/huanqiucs/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/huanqiucs.access.log;
    error_log /var/log/nginx/huanqiucs.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location ^~ /api/ { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
